# Fallow config: keep signal on app code; silence SvelteKit / tooling noise.
# https://docs.fallow.tools/

# Vendored oxlint anti-slop plugins (incl. opt-in Effect rules) and the
# committed analysis snapshot are not part of the app dependency graph.
ignorePatterns = [
	"tools/oxlint/**",
	"fallow-results.json"
]

# Framework and CSS packages live in devDependencies by SvelteKit convention.
# Vercel uses a full `npm install` (not --omit=dev), so these are not
# production-install hazards for this deploy model.
ignoreDependencies = [
	"@fontsource/inter",
	"@fontsource/manrope",
	"@oxlint/plugins",
	"@sveltejs/kit",
	"@tailwindcss/forms",
	"@tailwindcss/typography",
	"svelte",
	"tailwindcss"
]

[rules]
# Same rationale as ignoreDependencies above — suppress the rule globally
# so future framework packages are not flagged for this stack.
"dev-dependencies-in-production" = "off"
